[package]
name = "ninjago-checkin"
version = "1.0.0"
description = "幻影忍者自主学习打卡台"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ninjago_checkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
