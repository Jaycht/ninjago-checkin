name: Build Android App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 25.2.9519653

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java (JDK 17, required by Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages & NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Init Tauri Android (generates gen/android + conf)
        run: npx tauri android init

      - name: Patch Android (orientation + INTERNET + label + statusBar + icons)
        continue-on-error: true
        run: python3 ci_patch_android.py

      - name: Setup Android release signing (debug keystore for sideload)
        run: python3 ci_sign.py

      - name: Build Android APK (release, stripped & smaller)
        run: npx tauri android build --apk

      - name: Rename APK with app name and version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          src_apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$src_apk" ]; then echo "APK not found"; exit 1; fi
          dst_name="九漫成长营-${{ github.ref_name }}.apk"
          cp "$src_apk" "$dst_name"
          echo "Renamed APK to $dst_name"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninjago-android-${{ github.run_number }}
          path: 九漫成长营-*.apk
          if-no-files-found: warn

      - name: Publish to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 九漫成长营-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
