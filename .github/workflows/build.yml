name: Build Android App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 25.2.9519653

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java (JDK 17, required by Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages & NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Init Tauri Android (generates gen/android + conf)
        run: npx tauri android init

      - name: Patch Android (orientation + INTERNET + label)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, pathlib

          manifest = pathlib.Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              t = manifest.read_text(encoding='utf-8')
              if 'xmlns:android=' not in t:
                  t = t.replace('<manifest', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1)
              perms=''
              if 'android.permission.INTERNET' not in t:
                  perms+='    <uses-permission android:name="android.permission.INTERNET" />\n'
              if perms:
                  t=t.replace('</manifest>', perms+'</manifest>')
              t2 = re.sub(r'(<activity\b[^>]*?)(\sandroid:screenOrientation="[^"]*")', r'\1 android:screenOrientation="sensor"', t, count=1, flags=re.S)
              if t2 == t:
                  t2 = re.sub(r'(<activity\b)', r'\1 android:screenOrientation="sensor"', t, count=1, flags=re.S)
              manifest.write_text(t2, encoding='utf-8')
              print('AndroidManifest patched (INTERNET + sensor orientation)')
          else:
              print('AndroidManifest not found, skip')

          strings = pathlib.Path('src-tauri/gen/android/app/src/main/res/values/strings.xml')
          if strings.exists():
              s = strings.read_text(encoding='utf-8')
              s2 = re.sub(r'(<string name="app_name"[^>]*>)[^<]*(</string>)', r'\1九漫成长营\2', s, count=1)
              strings.write_text(s2, encoding='utf-8')
              print('app label set to 九漫成长营')
          else:
              print('strings.xml not found, skip')

          # ---- 修复 Tauri 2.x 生成的 build.gradle.kts 里 `import java.util.Properties`
          #      与 Gradle Kotlin DSL 默认导入的 kotlin.properties.Properties 冲突(ambiguous)，
          #      导致脚本编译失败 (Script compilation errors: Conflicting import 'Properties') ----
          #      做法：删掉该 import 行，并把代码中裸 `Properties` 改为全限定 `java.util.Properties`
          #      （保留 load/getProperty，且不影响 localProperties 这类标识符）。
          gradle_kts = pathlib.Path('src-tauri/gen/android/app/build.gradle.kts')
          if gradle_kts.exists():
              g = gradle_kts.read_text(encoding='utf-8')
              g = g.replace('import java.util.Properties\r\n', '').replace('import java.util.Properties\n', '')
              g = re.sub(r'(?<![.\w])Properties', 'java.util.Properties', g)
              gradle_kts.write_text(g, encoding='utf-8')
              print('build.gradle.kts patched (Properties ambiguous fix)')
          else:
              print('build.gradle.kts not found, skip')
          PY

      - name: Setup Android release signing (debug keystore for sideload)
        run: python3 ci_sign.py

      - name: Build Android APK (release, stripped & smaller)
        run: npx tauri android build --apk

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninjago-android-${{ github.run_number }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Publish to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
