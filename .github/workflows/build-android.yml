name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -s -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm install

      - name: Init Android project
        run: npx tauri android init

      # tauri android build 默认即 release 构建（--debug 才是调试版），并已自动 strip 符号
      - name: Build Android APK (release)
        run: npx tauri android build --apk

      # Tauri 的 release 包默认未签名，Android 无法安装 -> 用 debug keystore 签名后可直接装真机
      - name: Sign APK (debug keystore)
        run: |
          KEYSTORE=$HOME/.android/debug.keystore
          if [ ! -f "$KEYSTORE" ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v -keystore "$KEYSTORE" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          UNSIGNED=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          echo "unsigned apk: $UNSIGNED"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p 4 "$UNSIGNED" aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android \
            --out ninjago-checkin.apk aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify ninjago-checkin.apk && echo "SIGNED OK"
          ls -lh ninjago-checkin.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-v1.2.0
          name: 忍者打卡 Android APK (已签名, 可安装)
          files: ninjago-checkin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
