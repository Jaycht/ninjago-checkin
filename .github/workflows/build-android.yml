name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -s -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm install

      - name: Init Android project
        run: npx tauri android init

      # release 构建 + 按 ABI 拆分（去掉 debug 符号、单架构，体积从 439MB 降到约 10-20MB）
      - name: Build Android APK (release, split per ABI)
        run: npx tauri android build --release --apk --split-per-abi

      - name: Prepare APKs (只留手机架构)
        run: |
          A64=$(find src-tauri/gen/android -name "*arm64-v8a*.apk" | head -1)
          AV7=$(find src-tauri/gen/android -name "*armeabi-v7a*.apk" | head -1)
          cp "$A64" ninjago-arm64-release.apk
          cp "$AV7" ninjago-armv7-release.apk
          ls -lh ninjago-arm64-release.apk ninjago-armv7-release.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-v1.1.0
          name: 忍者打卡 Android APK (release)
          files: |
            ninjago-arm64-release.apk
            ninjago-armv7-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
